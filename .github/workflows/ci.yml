name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7

      # Installs Erlang and Elixir from mise.toml, the same versions used locally.
      - uses: jdx/mise-action@v5

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Gate checks
        run: sh .smelt/checks.sh
