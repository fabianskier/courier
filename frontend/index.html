<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courier</title>
    <!-- Sets the light or dark mode before the first paint: the stored choice
         (`courier.theme`, see src/components/theme-provider.tsx) or the
         operating system's preference. -->
    <script id="theme-script">
      ;(function () {
        var dark
        try {
          var stored = localStorage.getItem('courier.theme')
          dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          dark = false
        }
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
